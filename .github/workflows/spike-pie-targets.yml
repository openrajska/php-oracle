# THROWAWAY (spike #12, never merged): does rajska_oracle (ext-php-rs 0.16 + oracledb
# 26.0.0-beta.6) build and load on every PIE target? Runs only on the spike branch.
name: spike-pie-targets

on:
  push:
    branches: [spike/pie-targets]
  workflow_dispatch:

env:
  RUST_VERSION: "1.100.0"
  EXT_DIR: spikes/rust-oracledb/php-ext

jobs:
  linux:
    name: linux ${{ matrix.arch }} ${{ matrix.libc }} ${{ matrix.ts }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        libc: [glibc, musl]
        ts: [nts, zts]
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
          - { libc: glibc, distro: bookworm }
          - { libc: musl, distro: alpine }
          - { ts: nts, variant: cli }
          - { ts: zts, variant: zts }
    steps:
      - uses: actions/checkout@v4
      - name: Start Oracle Free (for a real Call)
        run: |
          docker run -d --name oracle -p 1521:1521 \
            -e ORACLE_PASSWORD=sys -e APP_USER=rajska -e APP_USER_PASSWORD=rajska \
            gvenzl/oracle-free:slim-faststart
      - name: Build and smoke test in php:8.4-${{ matrix.variant }}-${{ matrix.distro }}
        run: |
          docker run --rm --network host -v "$PWD:/src" -w /src \
            -e RUST_VERSION -e ORACLE_CONNECT_STRING=127.0.0.1:1521/FREEPDB1 \
            -e ORACLE_USER=rajska -e ORACLE_PASSWORD=rajska \
            php:8.4-${{ matrix.variant }}-${{ matrix.distro }} sh -euc '
              if command -v apk >/dev/null; then
                apk add --no-cache build-base clang clang-libclang curl binutils
              else
                apt-get update -qq && apt-get install -y -qq build-essential libclang-dev curl >/dev/null
              fi
              curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal --default-toolchain "$RUST_VERSION"
              . "$HOME/.cargo/env"
              '"$EXT_DIR"'/ci/build-unix.sh
            '

  macos:
    name: macos arm64 ${{ matrix.ts }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        ts: [nts, zts]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: none
        env:
          phpts: ${{ matrix.ts }}
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - run: $EXT_DIR/ci/build-unix.sh

  windows:
    name: windows x86_64 ${{ matrix.ts }} ${{ matrix.toolchain }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        ts: [nts, ts]
        toolchain: [stable-bootstrap]
        include:
          - { ts: nts, toolchain: nightly }
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: none
        env:
          phpts: ${{ matrix.ts }}
      - name: Rust toolchain
        run: |
          if ("${{ matrix.toolchain }}" -eq "nightly") { $tc = "nightly" } else { $tc = "$env:RUST_VERSION"; "RUSTC_BOOTSTRAP=1" >> $env:GITHUB_ENV }
          rustup toolchain install $tc --profile minimal
          rustup default $tc
          rustc -V
      - name: Build
        working-directory: ${{ env.EXT_DIR }}
        run: |
          php -v
          cargo build --release --locked --target-dir target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target\release\rajska_oracle.dll out\php_rajska_oracle.dll
          Get-Item out\php_rajska_oracle.dll | Format-List Name,Length
      - name: Load and smoke test
        working-directory: ${{ env.EXT_DIR }}
        run: |
          $dll = (Resolve-Path out\php_rajska_oracle.dll).Path
          php -n -d "extension=$dll" -m | Select-String -Pattern '^rajska_oracle$'
          php -n -d "extension=$dll" smoke.php
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
