# Builds the Extension (rajska_oracle) for PHP 8.4 NTS and ZTS, starts Oracle
# AI Database 26ai Free, installs the fixtures and runs both suites: the
# Extension's (cargo) and Core's (PHPUnit, with the Extension loaded).
#
# Core's suite also runs against the minimum Extension Core declares
# (spec #32 §15), built from its release tag: see
# .github/scripts/extension-matrix.sh for when that leg runs.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      minimum-ref:
        description: Build the minimum-Extension leg from this ref (tag, branch or SHA) instead of the minimum's release tag
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Same toolchain as ddev (.ddev/web-build/Dockerfile.rust).
  RUST_TOOLCHAIN: "1.100.0"

jobs:
  extensions:
    name: Extension versions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: The latest and the minimum Extension
        id: matrix
        env:
          MINIMUM_REF: ${{ inputs.minimum-ref }}
        run: .github/scripts/extension-matrix.sh >> "$GITHUB_OUTPUT"

  test:
    name: PHP 8.4 ${{ matrix.ts }}, Extension ${{ matrix.extension }}
    needs: extensions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.extensions.outputs.matrix) }}
    services:
      oracle:
        # Same image as ddev (.ddev/docker-compose.oracle.yaml).
        image: gvenzl/oracle-free:23.26.3-faststart
        env:
          ORACLE_PASSWORD: oracle
        ports:
          - 1521:1521
          # The TCPS listeners of fixtures/tls (one-way TLS, mTLS).
          - 2484:2484
          - 2485:2485
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 30s
          --health-retries 30
    env:
      ORACLE_CONNECT_STRING: localhost:1521/FREEPDB1
      ORACLE_USER: rajska
      ORACLE_PASSWORD: rajska
      ORACLE_TLS_CONNECT_STRING: tcps://localhost:2484/FREEPDB1
      ORACLE_MTLS_CONNECT_STRING: tcps://localhost:2485/FREEPDB1
      # The CDB root, where the DRCP statistics (V$CPOOL_CC_STATS) are.
      ORACLE_ADMIN_CONNECT_STRING: localhost:1521/FREE
      ORACLE_ADMIN_USER: system
      ORACLE_ADMIN_PASSWORD: oracle
      # The Extension under test: this checkout's, or the minimum's.
      EXTENSION_DIR: ${{ github.workspace }}/${{ matrix.ref != '' && 'minimum/' || '' }}packages/php-oracle-ext
      EXTENSION: ${{ github.workspace }}/${{ matrix.ref != '' && 'minimum/' || '' }}packages/php-oracle-ext/target/debug/librajska_oracle.so
      EXTENSION_CARGO_TOML: ${{ github.workspace }}/${{ matrix.ref != '' && 'minimum/' || '' }}packages/php-oracle-ext/Cargo.toml
    steps:
      - uses: actions/checkout@v5

      - name: Check out the minimum Extension
        if: matrix.ref != ''
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}
          path: minimum

      - name: Set up PHP 8.4 ${{ matrix.ts }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          # oci8 only for the test harness's IndependentSession, never a Backend.
          extensions: oci8
          tools: composer
          coverage: none
        env:
          phpts: ${{ matrix.ts }}

      - name: Check thread safety
        run: |
          php -v
          php -r 'exit(PHP_ZTS === ("${{ matrix.ts }}" === "zts") ? 0 : 1);'

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.ref != '' && 'minimum/' || '' }}packages/php-oracle-ext
          key: ${{ matrix.ts }}${{ matrix.ref != '' && '-minimum' || '' }}

      - name: Build the Extension
        working-directory: ${{ env.EXTENSION_DIR }}
        run: |
          cargo build --locked
          php -d extension="$EXTENSION" --ri rajska_oracle

      # Before anything logs on: it restarts the instance. 200 processes,
      # ~90 of them background ones, left too little room for the suites
      # (ORA-12516); fixtures/sql/processes.sql says why.
      - name: Raise the database's process limit
        run: |
          oracle="${{ job.services.oracle.id }}"
          docker cp fixtures/sql/processes.sql "$oracle:/tmp/processes.sql"
          docker exec "$oracle" sqlplus -s -l / as sysdba @/tmp/processes.sql 400
          for attempt in $(seq 1 60); do
            if echo "select 'pdb' || '_open' from dual;" \
              | docker exec -i "$oracle" sqlplus -s -l sys/oracle@//localhost/FREEPDB1 as sysdba \
              | grep -q pdb_open; then
              exit 0
            fi
            sleep 1
          done
          echo "FREEPDB1 did not come back after the restart." >&2
          exit 1

      - name: Install the fixtures
        run: |
          oracle="${{ job.services.oracle.id }}"
          docker cp fixtures/sql "$oracle:/tmp/fixtures"
          docker exec -i "$oracle" bash -euo pipefail <<EOF
          cd /tmp/fixtures
          sqlplus -s -l sys/oracle@//localhost/FREEPDB1 as sysdba <<'SQL'
          whenever sqlerror exit failure
          create user $ORACLE_USER identified by "$ORACLE_PASSWORD"
            default tablespace users quota unlimited on users;
          grant db_developer_role to $ORACLE_USER;
          exit
          SQL
          sqlplus -s -l sys/oracle@//localhost/FREEPDB1 as sysdba @grants.sql $ORACLE_USER
          sqlplus -s -l sys/oracle@//localhost/FREE as sysdba @drcp.sql
          sqlplus -s -l $ORACLE_USER/$ORACLE_PASSWORD@//localhost/FREEPDB1 @install.sql
          EOF

      - name: Start the TCPS listeners
        run: |
          oracle="${{ job.services.oracle.id }}"
          docker cp fixtures/tls "$oracle:/tmp/rajska-tls-src"
          docker exec "$oracle" bash /tmp/rajska-tls-src/listeners.sh

      # After the fixtures: the Pool's tests log on as the suites' user.
      # The minimum's own suite passed when it was released.
      - name: Extension suite
        if: matrix.ref == ''
        working-directory: packages/php-oracle-ext
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Install Core's dependencies
        working-directory: packages/php-oracle
        # Composer runs without the Extension loaded (spec #32 §15).
        run: composer install --no-interaction --no-progress --ignore-platform-req=ext-rajska_oracle

      - name: Static analysis
        working-directory: packages/php-oracle
        run: composer analyse

      - name: Core suite
        working-directory: packages/php-oracle
        run: php -d extension="$EXTENSION" vendor/bin/phpunit
