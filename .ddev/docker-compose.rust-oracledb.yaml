# Fork openrajska/rust-oracledb (o crate `oracledb` com os nossos patches; ver
# RAJSKA.md nele) montado no container web, para `ddev fork` rodar a suíte do
# crate contra o serviço `oracle`.
#
# Sem o clone, o Docker cria ../rust-oracledb vazio; `git clone` aceita um
# diretório vazio, então basta clonar e reiniciar.
services:
  web:
    volumes:
      - ${DDEV_APPROOT}/../rust-oracledb:/var/www/rust-oracledb
