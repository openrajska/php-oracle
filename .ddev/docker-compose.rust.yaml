# Caches do cargo em volumes nomeados e persistentes: o build incremental
# sobrevive ao `ddev restart` e o target/ fica fora do sync do Mutagen.
# Para limpar: `ddev stop` e depois
# `docker volume rm ddev-php-oracle_cargo-registry ddev-php-oracle_cargo-target`.
services:
  web:
    environment:
      # O banco é o serviço `oracle`, não localhost; o resto é o padrão das
      # suítes (phpunit.xml.dist).
      - ORACLE_CONNECT_STRING=oracle:1521/FREEPDB1
      - ORACLE_ADMIN_CONNECT_STRING=oracle:1521/FREE
      # TLS e mTLS pelos listeners TCPS de fixtures/tls (o container os sobe ao iniciar).
      - ORACLE_TLS_CONNECT_STRING=tcps://oracle:2484/FREEPDB1
      - ORACLE_MTLS_CONNECT_STRING=tcps://oracle:2485/FREEPDB1
    volumes:
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/var/cache/cargo-target

volumes:
  cargo-registry:
  cargo-target:
