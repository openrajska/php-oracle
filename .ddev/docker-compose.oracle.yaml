# Oracle AI Database 26ai Free (gvenzl/oracle-free), só para desenvolvimento.
#
# - "-faststart": o banco já vem expandido na imagem, então sobe em segundos.
# - Efêmero de propósito: sem volume. `ddev stop`/`ddev restart` recriam um banco
#   limpo. `ddev pause` preserva os dados (não remove o container).
services:
  oracle:
    container_name: ddev-${DDEV_SITENAME}-oracle
    image: gvenzl/oracle-free:23.26.3-faststart
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    environment:
      ORACLE_PASSWORD: oracle
    ports:
      - "127.0.0.1:1521:1521"
    volumes:
      - ${DDEV_APPROOT}/fixtures/tls:/fixtures/tls:ro
      - ./oracle-startdb:/container-entrypoint-startdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30
