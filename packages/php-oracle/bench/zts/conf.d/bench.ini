; FrankenPHP's php.ini additions for the worker-mode run (load.sh sets
; PHP_INI_SCAN_DIR here). The same settings as ../../php.ini; both drivers
; are loaded because one server serves every driver.
zend_extension=opcache
opcache.enable=1
opcache.enable_cli=1
opcache.jit=disable
zend.assertions=-1
memory_limit=1G
date.timezone=UTC
extension=oci8.so
extension=/var/cache/cargo-target/core-bench/release/libphp_oracledb.so
