; The one php.ini of every benchmark process, Core's and oci8's alike
; (run.php starts PHP with -c this file and no scan directory). Each process
; adds only its own driver: -d extension=oci8 or -d extension=<oracledb>.
; Production-like: OPcache on, assertions compiled out, no debugger.
zend_extension=opcache
opcache.enable=1
opcache.enable_cli=1
opcache.jit=disable
zend.assertions=-1
memory_limit=1G
date.timezone=UTC
error_reporting=E_ALL
display_errors=stderr
